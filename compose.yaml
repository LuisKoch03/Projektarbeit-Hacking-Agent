services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.key=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      ZAP_PORT: "8090"
    restart: unless-stopped

